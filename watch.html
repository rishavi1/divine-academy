<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Watch Lesson | Divine Academy</title><link rel="stylesheet" href="styles.css">
<style>
.learning-wrap{max-width:1200px;margin:auto;padding:28px 20px 70px}.watch-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.8fr);gap:22px}.panel{background:#fff;border:1px solid #e2e8f3;border-radius:18px;padding:20px;box-shadow:0 8px 28px #172a4d0a}.player-box{aspect-ratio:16/9;background:#0c1224;border-radius:15px;overflow:hidden;display:grid;place-items:center}.player-box iframe,.player-box video{width:100%;height:100%;border:0}.player-placeholder{color:white;text-align:center;padding:20px}.watch-actions{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.action-btn,.soft-btn{padding:11px 14px;border:0;border-radius:10px;text-decoration:none;font-weight:800;cursor:pointer}.action-btn{background:#244fc4;color:white}.soft-btn{background:#eef2fc;color:#2347a4}.lesson-list{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow:auto}.lesson-row{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid #e2e8f3;border-radius:12px;color:#18264a;text-decoration:none}.lesson-row strong{display:block}.lesson-row small{color:#69758c}.lesson-row.current{border-color:#426bd2;background:#f2f6ff}.small-muted{color:#69758c;font-size:14px}@media(max-width:800px){.watch-grid{grid-template-columns:1fr}}
</style></head>
<body>
<header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">DA</span><span>Divine Academy<small>Learn. Practice. Achieve.</small></span></a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button><nav class="main-nav"><a href="index.html">Home</a><a href="courses.html">Subjects</a><a href="videos.html">My Learning</a><a href="admin.html">Add Lessons</a></nav></div></header>
<main class="learning-wrap"><p><a href="courses.html">← All subjects</a></p><div class="watch-grid">
<section><div class="player-box" id="player"><div class="player-placeholder">Loading lesson…</div></div><div class="watch-meta"><p class="small-muted" id="watch-subject"></p><h1 id="watch-title">Lesson</h1><p id="watch-description" class="small-muted"></p><div class="watch-actions"><button class="action-btn" id="save-button">☆ Save for later</button><button class="soft-btn" id="complete-button">✓ Mark completed</button><a class="soft-btn" id="prev-button" href="#">← Previous</a><a class="action-btn" id="next-button" href="#">Next lesson →</a></div><p class="small-muted" id="watch-note">Your lesson progress is saved in this browser.</p></div></section>
<aside class="panel"><h2>Course lessons</h2><div id="watch-lesson-list" class="lesson-list"></div></aside>
</div></main><script src="script.js"></script></body></html>
