<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login | Divine Academy</title><link rel="stylesheet" href="styles.css"><style>.login-box{max-width:440px;margin:70px auto;padding:26px;background:white;border:1px solid #e2e8f3;border-radius:18px;box-shadow:0 10px 30px #172a4d12}.login-box label{display:block;margin:14px 0;font-weight:700}.login-box input{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #d8e0ef;border-radius:10px}.login-box button{padding:12px 18px;border:0;border-radius:10px;background:#244fc4;color:white;font-weight:800;cursor:pointer}</style></head><body><main class="login-box"><div class="brand-mark">DA</div><h1>Student login</h1><p>Enter the ID and password provided by your teacher.</p><form id="student-login"><label>Student ID<input id="student-id" required autocomplete="username"></label><label>Password<input id="student-password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in</button></form><p id="login-message" aria-live="polite"></p></main><script type="module" src="student-login.js"></script></body></html>
